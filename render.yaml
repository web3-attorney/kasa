services:
  - type: web
    name: kasa
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VITE_SAVINGS_ADDRESS
        value: 0xce160338e23cbd581bfecc8f5857c7c4f686d9b6
      - key: VITE_REGISTRY_ADDRESS
        value: 0x6a86b61cb3205b8d017186b8ecc9629641c6dd21
      - key: VITE_ROUTER_ADDRESS
        value: 0x620140d0d4f7e1561800cec34d7c0d4a9f05f101
